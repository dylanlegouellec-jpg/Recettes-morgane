<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Livre de Recettes</title>
  <!-- Tailwind CSS pour le style -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            terracotta: '#C86B4D',
            'terracotta-dark': '#B35D40',
            sage: '#8FA89B',
            'sage-dark': '#7A9487',
            brown: '#3D3431',
          }
        }
      }
    }
  </script>
  <!-- React et Babel pour exécuter le code directement dans le navigateur -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#FBF9F6]">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // ─────────────────────────────────────────────────────────────
    // COMPOSANTS FORMULAIRE
    // ─────────────────────────────────────────────────────────────
    const UNITES = ['', 'g', 'kg', 'ml', 'cl', 'l', 'cuillère(s)', 'pincée(s)', 'gousse(s)'];

    function IngredientsInput({ value, onChange, accent }) {
      const ringClass = accent === 'sage' ? 'focus:ring-sage/20 focus:border-sage/50' : 'focus:ring-terracotta/20 focus:border-terracotta/50';
      
      const handleChange = (index, field, val) => {
        const next = [...value];
        next[index] = { ...next[index], [field]: val };
        onChange(next);
      };

      return (
        <div className="space-y-3">
          {value.map((ing, index) => (
            <div key={index} className="flex items-center gap-2">
              <input type="text" value={ing.nom} placeholder="Ex: Farine" onChange={(e) => handleChange(index, 'nom', e.target.value)} className={`flex-[2] min-w-0 px-3.5 py-2 rounded-xl bg-white/70 border border-brown/15 text-sm text-brown ${ringClass}`} />
              <input type="text" value={ing.quantite} placeholder="Qte" onChange={(e) => handleChange(index, 'quantite', e.target.value)} className={`w-16 text-center px-2 py-2 rounded-xl bg-white/70 border border-brown/15 text-sm text-brown ${ringClass}`} />
              <select value={ing.unite} onChange={(e) => handleChange(index, 'unite', e.target.value)} className="flex-1 min-w-0 px-2 py-2 rounded-xl bg-white/70 border border-brown/15 text-sm text-brown">
                {UNITES.map(u => <option key={u} value={u}>{u || 'unité'}</option>)}
              </select>
              <button type="button" onClick={() => onChange(value.filter((_, i) => i !== index))} className="p-2 text-brown/40 hover:text-red-500">✕</button>
            </div>
          ))}
          <button type="button" onClick={() => onChange([...value, { nom: '', quantite: '', unite: '' }])} className="text-sm font-medium text-terracotta">+ Ajouter un ingrédient</button>
        </div>
      );
    }

    function StepsInput({ value, onChange, accent }) {
      const badgeClass = accent === 'sage' ? 'bg-sage' : 'bg-terracotta';
      return (
        <div className="space-y-4">
          {value.map((step, index) => (
            <div key={index} className="flex items-start gap-3">
              <span className={`mt-1 flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center font-semibold text-xs text-white ${badgeClass}`}>{index + 1}</span>
              <textarea rows="2" value={step} placeholder="Décris l'étape..." onChange={(e) => { const next = [...value]; next[index] = e.target.value; onChange(next); }} className="flex-1 px-3.5 py-2 rounded-xl bg-white/70 border border-brown/15 text-sm text-brown resize-none" />
              <button type="button" onClick={() => onChange(value.filter((_, i) => i !== index))} className="p-2 text-brown/40 hover:text-red-500">✕</button>
            </div>
          ))}
          <button type="button" onClick={() => onChange([...value, ''])} className="text-sm font-medium text-terracotta">+ Ajouter une étape</button>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────
    // APPLICATION PRINCIPALE
    // ─────────────────────────────────────────────────────────────
    function App() {
      const [recipes, setRecipes] = useState([]);
      const [selectedRecipe, setSelectedRecipe] = useState(null);
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [activeCategory, setActiveCategory] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');

      // Form State
      const [formTitre, setFormTitre] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [formPrep, setFormPrep] = useState(15);
      const [formCuisson, setFormCuisson] = useState(0);
      const [formPortions, setFormPortions] = useState(2);
      const [formType, setFormType] = useState('Sucré');
      const [formIngredients, setFormIngredients] = useState([{ nom: '', quantite: '', unite: '' }]);
      const [formEtapes, setFormEtapes] = useState(['']);

      useEffect(() => {
        const saved = localStorage.getItem('mes-recettes-data');
        if (saved) { try { setRecipes(JSON.parse(saved)); } catch(e){} }
      }, []);

      const saveRecipes = (next) => {
        setRecipes(next);
        localStorage.setItem('mes-recettes-data', JSON.stringify(next));
      };

      const handleCreate = () => {
        const newRecipe = {
          id: Math.random().toString(36).substring(2, 9),
          titre: formTitre || 'Recette sans titre',
          description: formDesc,
          tempsPreparation: formPrep,
          tempsCuisson: formCuisson,
          portions: formPortions,
          type: formType,
          ingredients: formIngredients.filter(i => i.nom.trim()),
          etapes: formEtapes.filter(e => e.trim()),
          createdAt: Date.now()
        };
        saveRecipes([newRecipe, ...recipes]);
        setIsFormOpen(false);
        setFormTitre(''); setFormDesc(''); setFormIngredients([{ nom: '', quantite: '', unite: '' }]); setFormEtapes(['']);
      };

      const filteredRecipes = useMemo(() => {
        return recipes.filter(r => {
          if (activeCategory && r.type !== activeCategory) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            return r.titre.toLowerCase().includes(q) || r.ingredients.some(i => i.nom.toLowerCase().includes(q));
          }
          return true;
        });
      }, [recipes, activeCategory, searchQuery]);

      return (
        <div className="min-h-screen pb-12 font-sans text-brown">
          <header className="sticky top-0 z-40 bg-[#FBF9F6]/80 backdrop-blur-md border-b border-brown/5 px-4 py-4 flex items-center justify-between">
            <h1 className="font-serif font-bold text-xl text-brown tracking-tight">Livre de Recettes 📖</h1>
            <button onClick={() => setIsFormOpen(true)} className="bg-terracotta text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:bg-terracotta-dark transition-all">+ Ajouter</button>
          </header>

          <div className="p-4 space-y-4 max-w-2xl mx-auto">
            <input type="text" placeholder="🔍 Rechercher une recette..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-white border border-brown/10 shadow-sm text-sm focus:outline-none" />
            
            <div className="flex gap-2">
              <button onClick={() => setActiveCategory(null)} className={`px-4 py-1.5 rounded-full text-xs font-semibold ${!activeCategory ? 'bg-brown text-white' : 'bg-white text-brown/60 border border-brown/10'}`}>Tout</button>
              <button onClick={() => setActiveCategory('Sucré')} className={`px-4 py-1.5 rounded-full text-xs font-semibold ${activeCategory === 'Sucré' ? 'bg-terracotta text-white' : 'bg-white text-brown/60 border border-brown/10'}`}>🍩 Sucré</button>
              <button onClick={() => setActiveCategory('Salé')} className={`px-4 py-1.5 rounded-full text-xs font-semibold ${activeCategory === 'Salé' ? 'bg-sage text-white' : 'bg-white text-brown/60 border border-brown/10'}`}>🍔 Salé</button>
            </div>

            {filteredRecipes.length === 0 ? (
              <div className="text-center py-12 text-brown/40 text-sm">Aucune recette. Ajoutes-en une ! ✨</div>
            ) : (
              <div className="grid gap-4 sm:grid-cols-2">
                {filteredRecipes.map(recipe => (
                  <div key={recipe.id} onClick={() => setSelectedRecipe(recipe)} className="bg-white p-4 rounded-2xl border border-brown/5 shadow-sm cursor-pointer transition-all">
                    <div className="flex justify-between items-start mb-1">
                      <h3 className="font-serif font-bold text-base text-brown">{recipe.titre}</h3>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${recipe.type === 'Sucré' ? 'bg-terracotta/10 text-terracotta' : 'bg-sage/10 text-sage-dark'}`}>{recipe.type}</span>
                    </div>
                    <p className="text-xs text-brown/50 line-clamp-2 mb-3">{recipe.description || 'Pas de description.'}</p>
                    <div className="text-[11px] text-brown/40 flex gap-3">
                      <span>⏱️ {Number(recipe.tempsPreparation) + Number(recipe.tempsCuisson)} min</span>
                      <span>🍳 {recipe.ingredients.length} ingr.</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* DETAIL */}
          {selectedRecipe && (
            <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm p-4 overflow-y-auto flex items-center justify-center">
              <div className="bg-[#FBF9F6] w-full max-w-lg rounded-3xl p-6 space-y-5 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-xs font-bold text-terracotta uppercase">{selectedRecipe.type}</span>
                    <h2 className="font-serif font-bold text-2xl text-brown">{selectedRecipe.titre}</h2>
                  </div>
                  <button onClick={() => setSelectedRecipe(null)} className="bg-white border border-brown/10 w-8 h-8 rounded-full flex items-center justify-center">✕</button>
                </div>
                
                <div className="grid grid-cols-3 gap-2 text-center bg-white p-3 rounded-xl text-xs text-brown/60">
                  <div><p className="font-bold text-brown">{selectedRecipe.tempsPreparation} min</p><p className="text-[10px]">Prép.</p></div>
                  <div><p className="font-bold text-brown">{selectedRecipe.tempsCuisson} min</p><p className="text-[10px]">Cuisson</p></div>
                  <div><p className="font-bold text-brown">{selectedRecipe.portions}</p><p className="text-[10px]">Portions</p></div>
                </div>

                <div className="space-y-2">
                  <h4 className="font-serif font-bold text-sm">Ingrédients</h4>
                  <ul className="bg-white rounded-xl p-3 space-y-1.5 text-sm">
                    {selectedRecipe.ingredients.map((ing, i) => (
                      <li key={i} className="flex justify-between text-brown/80 border-b border-brown/5 pb-1 last:border-0">
                        <span>• {ing.nom}</span>
                        <span className="font-medium text-brown/50">{ing.quantite} {ing.unite}</span>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="space-y-2">
                  <h4 className="font-serif font-bold text-sm">Instructions</h4>
                  <ol className="space-y-3 text-sm text-brown/80">
                    {selectedRecipe.etapes.map((step, i) => (
                      <li key={i} className="flex gap-3"><span className="font-bold text-terracotta">{i+1}.</span><p>{step}</p></li>
                    ))}
                  </ol>
                </div>

                <button onClick={() => { if(confirm('Supprimer ?')) { saveRecipes(recipes.filter(r => r.id !== selectedRecipe.id)); setSelectedRecipe(null); } }} className="w-full text-center text-xs text-red-500 font-medium">Supprimer la recette</button>
              </div>
            </div>
          )}

          {/* AJOUT */}
          {isFormOpen && (
            <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm p-4 overflow-y-auto flex items-center justify-center">
              <div className="bg-[#FBF9F6] w-full max-w-lg rounded-3xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center"><h2 className="font-serif font-bold text-lg">Nouvelle recette</h2><button onClick={() => setIsFormOpen(false)}>Fermer</button></div>
                <div className="space-y-3">
                  <input type="text" placeholder="Nom de la recette" value={formTitre} onChange={e => setFormTitre(e.target.value)} className="w-full px-3.5 py-2 rounded-xl border border-brown/10 text-sm" />
                  <input type="text" placeholder="Description" value={formDesc} onChange={e => setFormDesc(e.target.value)} className="w-full px-3.5 py-2 rounded-xl border border-brown/10 text-sm" />
                  
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setFormType('Sucré')} className={`flex-1 py-2 rounded-xl text-sm font-semibold ${formType === 'Sucré' ? 'bg-terracotta text-white' : 'bg-white border text-brown/60'}`}>🍩 Sucré</button>
                    <button type="button" onClick={() => setFormType('Salé')} className={`flex-1 py-2 rounded-xl text-sm font-semibold ${formType === 'Salé' ? 'bg-sage text-white' : 'bg-white border text-brown/60'}`}>🍔 Salé</button>
                  </div>

                  <div className="grid grid-cols-3 gap-2 text-xs">
                    <div><label>Prép (min)</label><input type="number" value={formPrep} onChange={e => setFormPrep(Number(e.target.value))} className="w-full p-2 rounded-xl border border-brown/10 text-center" /></div>
                    <div><label>Cuisson (min)</label><input type="number" value={formCuisson} onChange={e => setFormCuisson(Number(e.target.value))} className="w-full p-2 rounded-xl border border-brown/10 text-center" /></div>
                    <div><label>Portions</label><input type="number" value={formPortions} onChange={e => setFormPortions(Number(e.target.value))} className="w-full p-2 rounded-xl border border-brown/10 text-center" /></div>
                  </div>

                  <div className="space-y-1"><label className="text-xs font-bold text-brown/60">Ingrédients</label><IngredientsInput value={formIngredients} onChange={setFormIngredients} accent={formType === 'Sucré' ? 'terracotta' : 'sage'} /></div>
                  <div className="space-y-1"><label className="text-xs font-bold text-brown/60">Étapes</label><StepsInput value={formEtapes} onChange={setFormEtapes} accent={formType === 'Sucré' ? 'terracotta' : 'sage'} /></div>
                </div>
                <button onClick={handleCreate} className="w-full bg-brown text-white py-3 rounded-xl font-semibold text-sm shadow-sm">Enregistrer ✨</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
